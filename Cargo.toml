# Rust workspace: the BridgeHook CLI and its protocol core (HAL-2386).
# The desktop app (apps/desktop/src-tauri) keeps its own lockfile for now and
# moves onto bridgehook-core in a later milestone.
[workspace]
resolver = "2"
members = ["crates/bridgehook-core", "cli"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hallelx2/bridgehook"
rust-version = "1.82"

[workspace.dependencies]
bridgehook-core = { path = "crates/bridgehook-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
